<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting & Clock ===== -->
  <header class="header">
    <div class="greeting-block">
      <p id="greeting-text" class="greeting-text">Good morning</p>
      <h1 id="greeting-name" class="greeting-name">Friend</h1>
    </div>
    <div class="clock-block">
      <p id="clock-time" class="clock-time">00:00:00</p>
      <p id="clock-date" class="clock-date">Monday, 1 January 2025</p>
    </div>
    <div class="header-controls">
      <button id="theme-toggle" class="btn-icon" title="Toggle dark/light mode">🌙</button>
      <button id="edit-name-btn" class="btn-icon" title="Change your name">✏️</button>
    </div>
  </header>

  <!-- ===== NAME MODAL ===== -->
  <div id="name-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>What's your name?</h2>
      <input type="text" id="name-input" class="modal-input" placeholder="Enter your name" maxlength="30" />
      <div class="modal-actions">
        <button id="name-cancel" class="btn btn-secondary">Cancel</button>
        <button id="name-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <main class="main-grid">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>
      <div class="timer-custom">
        <label for="custom-minutes">Set minutes:</label>
        <input type="number" id="custom-minutes" class="custom-minutes-input" min="1" max="120" value="25" />
        <button id="timer-set" class="btn btn-ghost">Set</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <div class="todo-add">
        <input type="text" id="todo-input" class="todo-input" placeholder="Add a new task…" maxlength="100" />
        <button id="todo-add-btn" class="btn btn-primary">Add</button>
      </div>

      <div class="todo-toolbar">
        <select id="todo-sort" class="todo-sort">
          <option value="default">Sort: Default</option>
          <option value="az">Sort: A → Z</option>
          <option value="za">Sort: Z → A</option>
          <option value="done">Sort: Done last</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="links-add">
        <input type="text" id="link-name-input" class="link-input" placeholder="Name (e.g. YouTube)" maxlength="30" />
        <input type="url" id="link-url-input" class="link-input" placeholder="URL (e.g. https://youtube.com)" />
        <button id="link-add-btn" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
